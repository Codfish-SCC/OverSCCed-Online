<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OverSCCed 入口</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         display: flex; align-items: center; justify-content: center; height: 100vh;
         margin: 0; background: #fff; color: #1a1a1a; }
  .box { text-align: center; max-width: 480px; padding: 24px; }
  .logo { font-size: 44px; font-weight: 800; letter-spacing: 1px; margin-bottom: 10px; }
  .sub { color: #6e6e6e; font-size: 14px; margin-bottom: 22px; }
  button { font-size: 16px; font-weight: 700; padding: 12px 28px; border-radius: 10px;
           border: 1px solid #1a1a1a; background: #1a1a1a; color: #fff; cursor: pointer; }
  #status { margin-top: 16px; font-size: 13px; color: #6e6e6e; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">OverSCCed</div>
    <div class="sub" id="sub">正在查找最新服务器…</div>
    <button id="btn" onclick="go()" style="display:none">进入游戏</button>
    <div id="status"></div>
  </div>
<script src="mqtt_browser.js?v=27"></script>
<script>
var found = null, tried = 0;
function check() {
  var c = mqtt.connect("wss://broker-cn.emqx.io:8084/mqtt", { clientId: "go-" + Math.random().toString(36).slice(2, 10) });
  var to = setTimeout(function () { try { c.end(); } catch (e) {} finish(); }, 8000);
  c.on("message", function (t, p) {
    if (t !== "overscced/v1/url") return;
    try {
      var o = JSON.parse(new TextDecoder().decode(p));
      if (o && o.url && Date.now() - (o.ts || 0) < 300000) {
        clearTimeout(to);
        found = o.url;
        try { c.end(); } catch (e) {}
        show();
      }
    } catch (e) {}
  });
  c.on("connect", function () { c.subscribe("overscced/v1/url", { qos: 0 }); });
  c.on("error", function () {});
}
function show() {
  document.getElementById("sub").textContent = "服务器在线！";
  document.getElementById("btn").style.display = "inline-block";
  document.getElementById("status").textContent = found;
}
function finish() {
  tried++;
  if (tried < 3) {
    document.getElementById("status").textContent = "还在查找…（第 " + tried + " 次）";
    setTimeout(check, 3000);
  } else {
    document.getElementById("sub").textContent = "服务器暂未开启";
    document.getElementById("status").textContent = "请让房主在电脑上双击「开始服务器.command」，然后点下面按钮重试";
    document.getElementById("btn").style.display = "inline-block";
    document.getElementById("btn").textContent = "重新查找";
  }
}
function go() {
  if (found) location.replace(found);
  else { found = null; tried = 0; document.getElementById("btn").style.display = "none"; check(); }
}
check();
</script>
</body>
</html>
